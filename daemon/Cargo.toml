[package]
name = "hfastkey-daemon"
version = "0.1.0"
edition = "2021"
description = "Bộ gõ tiếng Việt độc lập viết bằng Rust: tự đóng vai IBus, không cần fcitx5/ibus"
license = "MIT"

[[bin]]
name = "hfastkey-daemon"
path = "src/main.rs"

[dependencies]
hfastkey = { path = ".." }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
