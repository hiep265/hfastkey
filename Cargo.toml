[package]
name = "hfastkey"
version = "0.2.0"
edition = "2021"
description = "Lõi bộ gõ tiếng Việt Telex của HFastKey"
license = "MIT"

[lib]
name = "hfastkey_core"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
members = [".", "daemon", "windows"]
